services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=utilitylens
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d utilitylens"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/utilitylens
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - path: ../backend/.env
        required: false
      - path: .env
        required: false
    volumes:
      - ../contracts:/contracts:ro
      - ../data:/data:ro
      - ../docs:/docs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["frontend", "full"]
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "80:8501"
      - "8501:8501"
    environment:
      - USE_MOCK_API=false
      - API_BASE_URL=http://backend:8000
    env_file:
      - path: ../web/.env
        required: false
      - path: .env
        required: false
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
